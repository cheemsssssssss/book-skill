name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 结构校验示例书源
        run: node scripts/validate-booksource.mjs examples/ --strict
      - name: 脚本语法自检
        run: |
          node --check scripts/validate-booksource.mjs
          node --check scripts/fetch-probe.mjs
